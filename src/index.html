<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café Time Period Timelapse</title>
<style>
  :root {
    --bg: #0a0a0f;
    --panel-bg: rgba(15,15,25,0.88);
    --accent: #e8a849;
    --accent2: #d45b43;
    --text: #e8e0d4;
    --text-dim: #8a8078;
    --border: rgba(232,168,73,0.25);
    --glow: rgba(232,168,73,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color:var(--text); }
  #canvas-container { position:fixed; inset:0; z-index:0; }
  canvas { display:block; width:100%; height:100%; }

  /* Timeline Slider - top */
  #timeline-panel {
    position:fixed; top:0; left:0; right:0; z-index:100;
    background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.7) 70%, transparent 100%);
    padding: 16px 32px 28px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  #timeline-title {
    font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim);
    font-weight:400;
  }
  #slider-container {
    position:relative; width:100%; max-width:900px; height:48px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #timeline-slider {
    -webkit-appearance:none; appearance:none; width:100%; height:6px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius:3px; outline:none; cursor:pointer;
    position:absolute; top:50%; transform:translateY(-50%);
  }
  #timeline-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #f5d08a, #c47a2a);
    border:3px solid #1a1a2a; box-shadow: 0 0 18px var(--glow), 0 2px 8px rgba(0,0,0,0.5);
    cursor:pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  #timeline-slider::-webkit-slider-thumb:hover { transform:scale(1.15); box-shadow: 0 0 28px var(--glow); }
  #timeline-slider::-moz-range-thumb {
    width:28px; height:28px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #f5d08a, #c47a2a);
    border:3px solid #1a1a2a; box-shadow: 0 0 18px var(--glow); cursor:pointer;
  }
  .year-marker {
    position:absolute; top:50%; transform:translate(-50%,-50%);
    font-size:12px; font-weight:600; color:var(--text-dim);
    text-align:center; pointer-events:none;
    transition: color 0.4s, transform 0.4s, text-shadow 0.4s;
    text-shadow: 0 0 0 transparent;
  }
  .year-marker.active {
    color:var(--accent); transform:translate(-50%,-50%) scale(1.3);
    text-shadow: 0 0 16px var(--glow);
  }
  .year-marker-label {
    position:absolute; top:100%; margin-top:4px; font-size:10px;
    color:var(--text-dim); white-space:nowrap; opacity:0.7;
    transition: opacity 0.4s, color 0.4s;
  }
  .year-marker.active .year-marker-label { opacity:1; color:var(--accent); }

  /* Era label */
  #era-label {
    position:fixed; top:100px; left:50%; transform:translateX(-50%);
    font-size:22px; font-weight:300; letter-spacing:6px; text-transform:uppercase;
    color:var(--accent); opacity:0; transition: opacity 0.8s;
    text-shadow: 0 0 30px var(--glow), 0 0 60px rgba(232,168,73,0.08);
    pointer-events:none; z-index:50;
  }
  #era-label.visible { opacity:1; }

  /* Controls */
  #controls {
    position:fixed; bottom:20px; left:20px; z-index:100;
    display:flex; gap:8px; align-items:center;
  }
  .ctrl-btn {
    background: var(--panel-bg); border:1px solid var(--border);
    color:var(--text); padding:8px 16px; border-radius:6px; cursor:pointer;
    font-size:13px; backdrop-filter:blur(12px); transition: all 0.3s;
  }
  .ctrl-btn:hover { background:rgba(232,168,73,0.15); border-color:var(--accent); }
  .ctrl-btn.active { background:rgba(232,168,73,0.2); border-color:var(--accent); color:var(--accent); }

  /* Info panel */
  #info-panel {
    position:fixed; bottom:20px; right:20px; z-index:100;
    background: var(--panel-bg); border:1px solid var(--border);
    border-radius:10px; padding:14px 20px; backdrop-filter:blur(16px);
    max-width:320px; font-size:13px; line-height:1.6; color:var(--text-dim);
    opacity:0.8; transition: opacity 0.3s;
  }
  #info-panel:hover { opacity:1; }
  #info-panel h3 { color:var(--accent); font-size:14px; margin-bottom:6px; font-weight:500; }

  /* Loading */
  #loading {
    position:fixed; inset:0; z-index:999; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.8s;
  }
  #loading.hidden { opacity:0; pointer-events:none; }
  .spinner {
    width:48px; height:48px; border:3px solid rgba(232,168,73,0.2);
    border-top-color:var(--accent); border-radius:50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading p { margin-top:20px; color:var(--text-dim); font-size:14px; letter-spacing:2px; }

  /* Transition overlay */
  #transition-overlay {
    position:fixed; inset:0; z-index:50; background:#000; opacity:0;
    pointer-events:none; transition: opacity 0.5s;
  }
  #transition-overlay.active { opacity:0.3; }

  /* Responsive */
  @media (max-width:600px) {
    #timeline-panel { padding:10px 12px 18px; }
    #slider-container { height:40px; }
    .year-marker { font-size:10px; }
    #era-label { font-size:16px; top:80px; }
    #info-panel { display:none; }
  }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><p>Brewing your café...</p></div>
<div id="canvas-container"></div>
<div id="transition-overlay"></div>

<div id="timeline-panel">
  <div id="timeline-title">Café Timeline</div>
  <div id="slider-container">
    <input type="range" id="timeline-slider" min="0" max="5" step="1" value="0" aria-label="Timeline slider">
    <div class="year-marker" data-year="0" style="left:0%">1945<span class="year-marker-label">Post-War</span></div>
    <div class="year-marker" data-year="1" style="left:20%">1965<span class="year-marker-label">Swinging</span></div>
    <div class="year-marker" data-year="2" style="left:40%">1985<span class="year-marker-label">Synthwave</span></div>
    <div class="year-marker" data-year="3" style="left:60%">2005<span class="year-marker-label">Digital</span></div>
    <div class="year-marker" data-year="4" style="left:80%">2025<span class="year-marker-label">Modern</span></div>
    <div class="year-marker" data-year="5" style="left:100%">2055<span class="year-marker-label">Future</span></div>
  </div>
</div>

<div id="era-label"></div>

<div id="controls">
  <button class="ctrl-btn" id="btn-pause" aria-label="Pause animation">⏸ Pause</button>
  <button class="ctrl-btn" id="btn-sfx" aria-label="Toggle sound">🔊 SFX</button>
  <button class="ctrl-btn" id="btn-reset" aria-label="Reset camera">↺ Reset</button>
</div>

<div id="info-panel">
  <h3>Café Time Period</h3>
  <p>Select a year on the timeline to witness the café transform across eras. Navigate with mouse orbit, zoom, and pan.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./main.js"></script>
</body>
</html>
