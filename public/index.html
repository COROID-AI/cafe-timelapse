<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Timelapse - Three.js Scene</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 100%;
            height: 100%;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="loading" id="loading">
        <h1>Loading Café Scene...</h1>
        <p>Please wait while the 3D environment loads.</p>
    </div>
    <div class="info" id="info">
        <p>Use mouse to orbit, pan, and zoom</p>
        <p>WASD keys for movement</p>
    </div>
    <script type="module" src="/js/scene-renderer.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
