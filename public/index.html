<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Timelapse - Three.js Scene</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }
        #container {
            width: 100%;
            height: calc(100% - 100px); /* Leave space for timeline at top */
            position: relative;
            margin-top: 100px; /* Space for timeline */
        }
        #timeline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .timeline-bar {
            position: relative;
            width: 80%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
        }
        .timeline-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #ff9e00, #ff6b6b);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 6px;
        }
        .timeline-markers {
            display: flex;
            justify-content: space-between;
            width: 80%;
            position: absolute;
            top: 100%;
            margin-top: 5px;
        }
        .timeline-marker {
            width: 12px;
            height: 12px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .timeline-marker.active {
            background: rgba(255,255,255,0.9);
            transform: scale(1.3);
            border-color: #ff9e00;
        }
        .timeline-marker:hover:not(.active) {
            background: rgba(255,255,255,0.5);
            transform: scale(1.1);
        }
        .timeline-label {
            position: absolute;
            top: 140%;
            font-size: 14px;
            white-space: nowrap;
        }
        .era-info {
            text-align: center;
            max-width: 80%;
        }
        .era-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,158,0,0.5);
        }
        .era-description {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            z-index: 10;
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            #timeline-container {
                height: 120px;
                padding: 15px;
            }
            #container {
                height: calc(100% - 120px);
                margin-top: 120px;
            }
            .timeline-bar {
                width: 90%;
            }
            .timeline-markers {
                width: 90%;
            }
            .era-info {
                max-width: 90%;
            }
            .era-name {
                font-size: 20px;
            }
            .era-description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="timeline-container">
        <div class="era-info">
            <div class="era-name" id="era-name">1945 — The Wartime Era</div>
            <div class="era-description" id="era-description">Wartime austerity meets resilient community spirit</div>
        </div>
        <div class="timeline-bar">
            <div class="timeline-fill" id="timeline-fill"></div>
        </div>
        <div class="timeline-markers" id="timeline-markers">
            <!-- Markers will be dynamically generated -->
        </div>
    </div>
    <div id="container"></div>
    <div class="loading" id="loading">
        <h1>Loading Café Scene...</h1>
        <p>Please wait while the 3D environment loads.</p>
    </div>
    <div class="info" id="info">
        <p>Use mouse to orbit, pan, and zoom</p>
        <p>WASD keys for movement</p>
    </div>
    <script type="module" src="/js/scene-renderer.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
