<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café Time Period Timelapse</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- 3D render canvas mount point -->
    <div id="scene-container"></div>

    <!-- Timeline slider UI -->
    <header id="timeline" class="timeline">
      <div class="timeline__label">Café Through Time</div>
      <div class="timeline__track">
        <input
          id="year-slider"
          class="timeline__slider"
          type="range"
          min="0"
          max="4"
          step="1"
          value="0"
          aria-label="Select year"
        />
        <div id="year-ticks" class="timeline__ticks"></div>
      </div>
      <div id="year-display" class="timeline__year">1945</div>
    </header>

    <!-- Loading overlay -->
    <div id="loader" class="loader">
      <div class="loader__spinner"></div>
      <div class="loader__text">Preparing the café…</div>
    </div>

    <!--
      Three.js core + OrbitControls addon via CDN.

      We use an importmap + an INLINE module script to pull THREE and
      OrbitControls from the CDN. Inline modules are NOT subject to the
      CORS restrictions that block externally-fetched module scripts under
      the file:// protocol, and the CDN URLs themselves are https:// so
      they load fine. The inline module exposes THREE globally so the
      classic application scripts below can use it.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      window.THREE = THREE;
      window.THREE.OrbitControls = OrbitControls;
      window.dispatchEvent(new Event("three-ready"));
    </script>

    <!--
      Application scripts — classic scripts loaded in dependency order.
      Each attaches its exports to the global `window.Cafe` namespace.
      main.js waits for the "three-ready" event before booting.
    -->
    <script src="./js/config.js"></script>
    <script src="./js/instancing-utils.js"></script>
    <script src="./js/scene-manager.js"></script>
    <script src="./js/cafe-shell.js"></script>
    <script src="./js/audio-manager.js"></script>
    <script src="./js/period-manager.js"></script>
    <script src="./js/timeline-ui.js"></script>
    <script src="./js/period1945.js"></script>
    <script src="./js/period2025.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
