<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Café Time Period Timelapse</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <h1>Café Time Period Timelapse</h1>
      <p id="era-label">Loading eras…</p>
    </div>
    <div id="timeline-wrap">
      <label for="timeline">Era</label>
      <input
        id="timeline"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0"
        aria-label="Timeline era selector"
      />
      <span id="timeline-year">1945</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
