<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Café Time Period Timelapse</title>
    <!-- Inline favicon (data URI) avoids a 404 console error for /favicon.ico -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #101014;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      /* Canvas mount point — the renderer's DOM element is appended here */
      #canvas-container {
        position: fixed;
        inset: 0;
      }

      #canvas-container canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>

    <!-- Timeline slider overlay styles -->
    <link rel="stylesheet" href="css/timeline.css" />

    <!-- Three.js loaded as ES modules via importmap (official modern approach) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Canvas mount point -->
    <div id="canvas-container"></div>

    <!-- Main application entry -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
